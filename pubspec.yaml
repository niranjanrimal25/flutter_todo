name: todo_app
description: Niranjan Todo — a beautiful todo app with reminders, alarms and a timer

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  flutter_local_notifications: ^22.3.0
  sqflite: ^2.4.3
  path: ^1.9.1
  intl: ^0.20.3
  google_fonts: ^8.2.1
  flutter_slidable: ^4.0.3
  timezone: ^0.11.1
  permission_handler: ^13.0.1
  nepali_utils: ^3.0.8
  nepali_date_picker: ^7.0.1
  alarm: ^5.11.0
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  audioplayers: ^6.6.0
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/

flutter_native_splash:
  color: "#6C63FF"
  color_dark: "#1A1A2E"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#6C63FF"
    color_dark: "#1A1A2E"
    image: assets/images/splash_logo.png
    icon_background_color: "#6C63FF"
    icon_background_color_dark: "#1A1A2E"
